name: WM6 ARMV4I Toolchain Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/toolchain-test.yml"
      - "ci/**"
      - "revivece/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read
  packages: read

jobs:
  build-hello-world:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ghcr.io/enlyze/windows-ce-build-environment-arm@sha256:22ea23d697accaab2b98fb12d81ccc1faade90f9fe490f554ae7c5c194dfe27c

    steps:
      - name: Check out ReviveCE
        uses: actions/checkout@v7

      - name: Validate repository contracts
        shell: bash
        run: bash ./ci/validate.sh

      - name: Verify CeGCC ARM compiler
        shell: bash
        run: |
          command -v arm-mingw32ce-gcc
          command -v arm-mingw32ce-g++
          command -v arm-mingw32ce-objdump
          arm-mingw32ce-gcc --version

      - name: Check out pinned wolfSSL 5.9.2
        uses: actions/checkout@v7
        with:
          repository: wolfSSL/wolfssl
          ref: ac01707f552c611fbd135cc723b2682b3e7f80f2
          path: third_party/wolfssl
          persist-credentials: false

      - name: Build ARMV4I HelloWorld
        shell: bash
        run: bash ./ci/build-hello.sh

      - name: Verify ARM Windows CE executable
        shell: bash
        run: bash ./ci/verify-ce-pe.sh ./dist/HelloWorld.exe

      - name: Build wolfSSL for Windows CE ARM
        shell: bash
        run: bash ./ci/build-wolfssl.sh

      - name: Build ReviveTLS M8
        shell: bash
        run: bash ./ci/build-revivetls.sh

      - name: Verify ReviveTLS ARM executable
        shell: bash
        run: bash ./ci/verify-ce-pe.sh ./dist/ReviveTLS.exe

      - name: Upload phone test artifact
        uses: actions/upload-artifact@v7
        with:
          name: WM6-ARMV4I-HelloWorld
          path: |
            dist/HelloWorld.exe
            dist/HelloWorld.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload ReviveTLS device test
        uses: actions/upload-artifact@v7
        with:
          name: ReviveTLS-M8-WM6-ARMV4I
          path: |
            dist/ReviveTLS.exe
            dist/ReviveTLS.exe.sha256
            dist/google-roots.pem
          if-no-files-found: error
          retention-days: 14
